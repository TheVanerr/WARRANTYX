# main dalına her gönderimde: testler geçerse program GitHub Pages'de yayınlanır.
# Test geçmezse yayın olmaz, kullananlar önceki sürümle devam eder.
# Bir kez açılması gerekir: depo Settings → Pages → Source: GitHub Actions.
name: Yayın

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  yayin:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: node tools/yayin-hazirla.js _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
